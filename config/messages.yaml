# Template pool for birthday messages. {name} is replaced with the
# recipient's first name, preceded by the roster row's `salutation` if set
# ("Mr Abhijit").
# {wish} and any other {var} are expanded from the `vars` pool below.
# A trailing emoji is appended ~60% of the time from `emoji`.

onTime:
  - "{name},\n\nHappy birthday!\n\n{wish}"
  - "{name},\n\nHey, happy birthday!\n\n{wish}"
  - "{name},\n\nwishing you a very happy birthday!\n\n{wish}"
  - "{name},\n\nHappy birthday!!\n\n{wish}"
  - "{name},\n\nmany happy returns of the day!\n\n{wish}"
  - "{name},\n\nhappy birthday to you!\n\n{wish}"

belated:
  - "{name},\n\nbelated happy birthday!\n\n{wish}"
  - "{name},\n\nsorry this is a day late — happy birthday!\n\n{wish}"
  - "{name},\n\njust realised I missed it — happy (belated) birthday!\n\n{wish}"

vars:
  wish:
    - "Have a great year ahead."
    - "Hope you have a wonderful day."
    - "Wishing you health and happiness."
    - "Hope this year brings you everything you're hoping for."
    - "Have an amazing one!"
    - "Hope it's a great one."

emoji:
  - "🎂"
  - "🎉"
  - "🥳"
  - "✨"
