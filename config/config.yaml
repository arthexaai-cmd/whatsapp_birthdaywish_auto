# WhatsApp Birthday Bot — configuration
# All values here have safe defaults; override anything via env vars of the
# same name in .env if you'd rather not edit this file.

timezone: Asia/Kolkata

roster:
  # Country used to interpret phone numbers with no country code.
  defaultCountry: IN
  # How Feb 29 birthdays are handled in non-leap years: "feb28" or "mar1"
  leapDayFallback: feb28

selection:
  # How many days back to keep retrying a missed birthday before giving up.
  catchupDays: 2

pacing:
  # Random delay (minutes) after the job starts before the first message.
  startJitterMinutes: [0, 75]
  # Messages per batch, randomised per batch.
  batchSize: [4, 7]
  # Gap (seconds) between messages inside a batch.
  withinBatchSeconds: [40, 150]
  # Gap (minutes) between batches.
  betweenBatchMinutes: [14, 28]
  # Simulated typing speed: ms of "typing..." presence per character.
  typingMsPerChar: [45, 90]
  # Hard ceiling on messages sent in a single run, regardless of how many match.
  dailyCap: 60
  # Never send outside this local-time window. ["HH:MM start", "HH:MM end"]
  # A window that wraps past midnight (e.g. 21:30 -> 08:30) is supported.
  quietHours: ["21:30", "08:30"]
  # New numbers with little/no send history get a lower daily cap that
  # ramps up over this many days of ledger history.
  warmupDays: 7
  warmupStartCap: 8

retry:
  # Consecutive outright send failures after which the whole run aborts
  # rather than continuing (protects the account from a degraded session).
  maxConsecutiveFailures: 2
  # Backoff before retrying a single failed send once, in seconds.
  retryBackoffSeconds: [60, 120]
