# Runs the test suite on every push and pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # the tests use the built-in node:sqlite
          cache: npm

      - run: npm ci
      - run: npm test
